<main>
<section>
  <h1>Contacto</h1>
  <p class="lead">¿Querés recomendarnos un juego o contarnos una idea? Escribinos.</p>
  <form id="form" novalidate>
    <div><label for="nombre">Nombre</label><input id="nombre" type="text"><div class="error" id="e-nombre"></div></div>
    <div><label for="correo">Correo</label><input id="correo" type="email"><div class="error" id="e-correo"></div></div>
    <div><label for="tema">Tema</label>
      <select id="tema"><option>Recomendar un juego</option><option>Reportar un error</option><option>Otro</option></select></div>
    <div><label for="mensaje">Mensaje</label><textarea id="mensaje" rows="5"></textarea><div class="error" id="e-mensaje"></div></div>
    <button class="boton" type="submit">Enviar mensaje</button>
  </form>
  <div id="respuesta" role="status"></div>
</section>
</main>
